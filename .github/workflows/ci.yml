name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web test
      - run: npm run build
      - run: npm run validate

  intelligence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-bootstrap-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTELLIGENCE_DATABASE_URL: postgresql://intelligence_app:ci-app-password@127.0.0.1:5432/business_context_ai_test
      INTELLIGENCE_MIGRATION_DATABASE_URL: postgresql://intelligence_migrator:ci-migration-password@127.0.0.1:5432/business_context_ai_test
      INTELLIGENCE_STORAGE_NAMESPACE: ci
      INTELLIGENCE_STATE_DIR: /tmp/alfa-intelligence-state
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --require-hashes -r apps/intelligence/requirements.lock -r apps/intelligence/requirements-dev.lock
      - name: Создать изолированные роли и тестовую базу PostgreSQL
        run: |
          python - <<'PY'
          import psycopg
          from psycopg import sql

          with psycopg.connect('postgresql://postgres:ci-bootstrap-password@127.0.0.1:5432/postgres', autocommit=True) as db:
              db.execute('CREATE ROLE intelligence_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS')
              db.execute(sql.SQL('CREATE ROLE intelligence_app LOGIN PASSWORD {} NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS').format(sql.Literal('ci-app-password')))
              db.execute(sql.SQL('CREATE ROLE intelligence_migrator LOGIN PASSWORD {} NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS INHERIT').format(sql.Literal('ci-migration-password')))
              db.execute('GRANT intelligence_owner TO intelligence_migrator')
              db.execute('CREATE DATABASE business_context_ai_test OWNER intelligence_owner')
              db.execute('REVOKE CONNECT ON DATABASE business_context_ai_test FROM PUBLIC')
              db.execute('GRANT CONNECT ON DATABASE business_context_ai_test TO intelligence_app,intelligence_migrator')
          PY
      - name: Применить миграции в тестовую базу
        env:
          PYTHONPATH: apps/intelligence
        run: python -m intelligence db migrate
      - name: Проверки против PostgreSQL без сети и ключей моделей
        env:
          PYTHONPATH: apps/intelligence
        run: |
          python -m pytest -q apps/intelligence/tests
          python apps/intelligence/scripts/export_contracts.py --check

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build web intelligence web-test intelligence-test intelligence-api intelligence-worker
      - run: docker compose --profile test run --rm web-test
      - run: docker compose --profile test run --build --rm intelligence-test
      - run: docker compose --profile tools run --build --rm intelligence demo
      - run: docker compose --profile tools run --build --rm intelligence evaluate
      - run: docker compose --profile analysis up --build --wait intelligence-api
      - run: curl --fail --silent --show-error http://127.0.0.1:8081/health
      - run: docker compose up --wait web
      - run: curl --fail --silent --show-error http://127.0.0.1:4173/healthz
      - if: always()
        run: docker compose down
