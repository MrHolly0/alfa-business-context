name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web test
      - run: npm run build
      - run: npm run validate

  intelligence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Проверки провайдеров без сети и ключей
        env:
          PYTHONPATH: apps/intelligence
        run: python -m unittest discover -s apps/intelligence/tests -v

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build web intelligence web-test intelligence-test
      - run: docker compose run --rm web-test
      - run: docker compose run --rm intelligence-test
      - run: docker compose run --rm intelligence
      - run: docker compose up --wait web
      - run: curl --fail --silent --show-error http://127.0.0.1:4173/healthz
      - if: always()
        run: docker compose down
