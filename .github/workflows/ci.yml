name: CI

on:
  push:
  pull_request:

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: apps/prototype/package-lock.json
      - run: npm ci --prefix apps/prototype
      - run: npm test
      - run: npm run build
      - run: npm run validate

  intelligence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Проверки провайдеров без сети и ключей
        env:
          PYTHONPATH: apps/intelligence
        run: python -m unittest discover -s apps/intelligence/tests -v
