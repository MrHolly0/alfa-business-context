pid /tmp/nginx.pid;
worker_processes 1;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  resolver 127.0.0.11 valid=5s ipv6=off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # These unhashed entrypoint assets must be revalidated after a deploy.
    # Nginx still serves conditional 304 responses via its ETag/Last-Modified
    # validators, while browsers won't keep an obsolete app shell indefinitely.
    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri =404;
    }

    location = /app.js {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri =404;
    }

    location = /core-ui.css {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri =404;
    }

    location ~ "^/[a-z0-9-]+-[0-9a-f]{12}[.](?:js|css)$" {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location /api/ {
      set $core_upstream http://core:8080;
      proxy_pass $core_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 600s;
      client_max_body_size 2m;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
