name: alfa-business-context

services:
  prototype:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4173:4173"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4173
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
